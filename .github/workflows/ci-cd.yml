name: Silicon West CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Continuous Integration (CI)
  # ==========================================
  ci:
    name: Build & Verify (Frontend & Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Backend verification
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      # Frontend verification
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: /api
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ==========================================
  # 2. Continuous Deployment (CD - Native PM2)
  # ==========================================
  deploy:
    name: Deploy to Production Server
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Navigating to project directory..."
            cd ${{ secrets.WORK_DIR || '~/siliconwest' }}

            echo "📥 Pulling latest changes from main branch..."
            git pull origin main

            echo "📦 Updating Backend..."
            cd backend
            npm install --production=false
            npx prisma generate
            npx prisma db push --skip-generate
            cd ..

            echo "📦 Updating & Building Frontend..."
            cd frontend
            npm install
            npm run build
            cd ..

            echo "Restarting PM2 Backend..."
            pm2 restart backend --update-env

            echo "Restarting PM2 Frontend..."
            pm2 restart frontend --update-env

            echo "✅ Deployment complete! Status:"
            pm2 status
