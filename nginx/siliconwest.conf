# ========================================================
# Nginx Configuration for Silicon West Event Management
# Place at: /etc/nginx/sites-available/siliconwest
# Symlink to: /etc/nginx/sites-enabled/siliconwest
# ========================================================

# Upstream definitions
upstream nextjs_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream express_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your domain or server IP

    # Allow large file/image uploads for club banners and event posters
    client_max_body_size 50M;

    # Gzip compression for fast loading
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 1. Route Backend API requests (/api/*)
    location /api/ {
        proxy_pass http://express_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for longer requests (like sending bulk emails)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Route Next.js Frontend requests
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Optional: Cache Next.js static assets
    location /_next/static/ {
        proxy_pass http://nextjs_frontend;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }
}

